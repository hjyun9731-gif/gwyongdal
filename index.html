<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffd12f"><title>운수종사자 일상점검</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ef;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#111}.w{max-width:540px;margin:auto;padding:10px}.brand{display:flex;gap:9px;align-items:center;font-size:22px;font-weight:950;margin:7px 0 14px}.logo{width:42px;height:42px;border-radius:12px;background:#ffd12f;display:grid;place-items:center}.card{background:#fff;border-radius:21px;padding:19px;margin-bottom:12px;box-shadow:0 7px 25px #0001}.screen{display:none}.on{display:block}h1{font-size:29px;line-height:1.2;margin:0 0 8px}.desc{font-size:17px;color:#555;line-height:1.5}.field{margin:14px 0}.field label{display:block;font-size:17px;font-weight:900;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;font-size:19px;padding:14px;border:1.5px solid #bbb;border-radius:13px;background:#fff}.btn{width:100%;min-height:70px;border:2px solid #111;border-radius:17px;background:#fff;margin:6px 0;font-size:22px;font-weight:950}.yellow{background:#ffd12f}.red{color:#c63731;border-color:#dc8a85}.small{border:1px solid #bbb;background:#fff;border-radius:10px;padding:9px 11px;font-weight:850}.member{border:2px solid #222;border-radius:16px;padding:15px;background:#fafafa;line-height:1.6}.member b{font-size:25px}.status{padding:16px;border-radius:15px;border:2px solid;text-align:center;font-size:22px;font-weight:950;margin:14px 0}.pending{background:#fff0ef;color:#c63731;border-color:#ffc0bb}.good{background:#eaf7ef;color:#16834e;border-color:#b9e3c9}.not_driving{background:#eee;color:#555;border-color:#ddd}.problem{background:#fff3e3;color:#a95600;border-color:#ffd39b}.issue{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid #ddd;border-radius:11px;margin:6px 0;font-weight:750;line-height:1.35}.issue input{width:22px;height:22px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.hist{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-weight:800}.help{padding:12px;border:1px solid #e5ce68;background:#fff6cf;border-radius:12px;line-height:1.5}canvas{width:100%;height:155px;border:2px dashed #999;border-radius:13px;background:#fafafa;touch-action:none}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-weight:900;display:none;z-index:9}</style>

</head><body><div class="w"><div class="brand"><div class="logo">✓</div>운수종사자 일상점검</div>
<section id="loading" class="card"><h1>확인 중</h1><div class="desc">잠시만 기다려 주세요.</div></section>
<section id="lookup" class="card screen"><h1>차량번호 확인</h1><div class="desc">처음 한 번만 입력합니다.</div><div class="field"><label>차량번호</label><input id="car" placeholder="예: 강원80자 1234호"></div><button class="btn yellow" onclick="lookup()">차량번호 확인</button></section>

<section id="signature" class="card screen"><h1>서명 등록</h1><div class="desc">처음 한 번만 손가락으로 서명하세요.</div><canvas id="sig"></canvas><div class="top" style="margin-top:8px"><button class="small" onclick="clearSig()">지우기</button><button class="small" onclick="saveSig()">서명 저장</button></div></section>

<script>const BASE='https://oqijoxllslsohxkyrkif.supabase.co',KEY='sb_publishable_8ns8LXmy8FP-LF0zbmqzVA_7ykNgMi6',STORE='daily_check_session_v3';const ITEMS=['번호판, 전면유리, 후사경 등의 청결상태','후미등, 차폭등 등 등화장치 작동상태','창닦이기 작동상태','적재함(보조지지대 포함), 측면 보호대, 후부반사판, 트레일러 연결장치의 부착 상태 및 훼손 여부','타이어 손상 및 마모(1.6㎜이상) 여부','화물, 적재함 지지대(판스프링) 등의 고정상태','바퀴 너트 등 균열 여부','냉각수, 공기압, 엔진오일 등 차량 이상 여부(계기판 확인)','좌석안전띠 상태','소화기 비치 여부','안전삼각대 등 비치 여부'];let s=null,looked=null,member=null,editAfter=false,ctx=null,drawing=false,signed=false;try{s=JSON.parse(localStorage.getItem(STORE)||'null')}catch{}const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function show(id){$('loading').style.display='none';document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}async function veh(body){let r=await fetch(BASE+'/functions/v1/vehicle-auth',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'서버 처리 오류');return j}async function refresh(){if(!s?.refresh_token)return false;let r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(!r.ok)return false;s=await r.json();localStorage.setItem(STORE,JSON.stringify(s));return true}async function req(path,opt={}){let h=Object.assign({apikey:KEY},opt.headers||{});if(s?.access_token)h.Authorization='Bearer '+s.access_token;if(opt.body&&!h['Content-Type'])h['Content-Type']='application/json';let r=await fetch(BASE+path,Object.assign({},opt,{headers:h}));if(r.status===401&&await refresh()){h.Authorization='Bearer '+s.access_token;r=await fetch(BASE+path,Object.assign({},opt,{headers:h}))}return r}async function rest(table,query='',opt={}){let r=await req('/rest/v1/'+table+(query?'?'+query:''),opt),j=await r.json().catch(()=>null);if(!r.ok)throw Error(j?.message||'DB 처리 오류');return j}async function user(){let r=await req('/auth/v1/user');if(!r.ok)return null;return r.json()}async function lookup(){let v=$('car').value.trim();if(!v)return toast('차량번호를 입력하세요.');try{looked=await veh({action:'lookup',vehicleNumber:v});let m=looked.member;$('memberBox').innerHTML='<b>'+esc(m.driver_name)+' 기사님</b><br>'+esc(m.vehicle_number)+'<br>휴대폰: '+esc(m.phone_masked)+'<br>주소: '+esc(m.home_address_masked)+'<br>운송사업자명: '+esc(m.operator_name||m.driver_name);show('confirm')}catch(e){alert(e.message)}}function goAuth(edit){editAfter=edit;let reg=looked.registered;$('authTitle').textContent=reg?'차량 로그인':'차량 등록';$('authDesc').textContent=reg?'등록할 때 만든 6자리 비밀번호를 입력하세요.':'앞으로 사용할 숫자 6자리 비밀번호를 정하세요.';$('pin2box').style.display=reg?'none':'block';$('authBtn').textContent=reg?'로그인':'등록하기';$('authBtn').onclick=reg?login:register;show('auth')}async function register(){let p=$('pin').value,p2=$('pin2').value;if(!/^\d{6}$/.test(p))return toast('숫자 6자리로 입력하세요.');if(p!==p2)return toast('비밀번호가 다릅니다.');try{let j=await veh({action:'register',vehicleNumber:looked.member.vehicle_number,pin:p});s=j.session;localStorage.setItem(STORE,JSON.stringify(s));await loadMember();afterAuth()}catch(e){alert(e.message)}}async function login(){let p=$('pin').value;if(!/^\d{6}$/.test(p))return toast('숫자 6자리로 입력하세요.');try{let j=await veh({action:'login',vehicleNumber:looked.member.vehicle_number,pin:p});s=j.session;localStorage.setItem(STORE,JSON.stringify(s));await loadMember();afterAuth()}catch(e){alert(e.message)}}async function loadMember(){let u=await user();if(!u)throw Error('로그인이 필요합니다.');let p=await rest('profiles','user_id=eq.'+u.id+'&select=member_id'),id=p[0]?.member_id;if(!id)throw Error('회원 연결정보가 없습니다.');let m=await rest('members','id=eq.'+id+'&select=id,driver_name,vehicle_number,phone,home_address,operator_name,signature_path');if(!m[0])throw Error('회원정보가 없습니다.');member=m[0]}function afterAuth(){if(editAfter){editAfter=false;return openProfile()}member.signature_path?home():openProfile()}function openProfile(){$('pName').value=member.driver_name||'';$('pCar').value=member.vehicle_number||'';$('pPhone').value=member.phone||'';$('pAddr').value=member.home_address||'';$('pBiz').value=member.operator_name||member.driver_name||'';show('profile')}async function saveProfile(){let v={driver_name:$('pName').value.trim(),vehicle_number:$('pCar').value.trim(),phone:$('pPhone').value.trim(),home_address:$('pAddr').value.trim(),operator_name:$('pBiz').value.trim()};if(!v.driver_name||!v.vehicle_number)return toast('이름과 차량번호를 입력하세요.');try{await rest('members','id=eq.'+member.id,{method:'PATCH',headers:{Prefer:'return=minimal','Content-Type':'application/json'},body:JSON.stringify(v)});await loadMember();toast('수정되었습니다.');profileDone()}catch(e){alert(e.message)}}function profileDone(){if(member.signature_path)return home();show('signature');setTimeout(initSig,30)}function initSig(){let c=$('sig'),r=c.getBoundingClientRect(),q=devicePixelRatio||1;c.width=r.width*q;c.height=r.height*q;ctx=c.getContext('2d');ctx.scale(q,q);ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#111';clearSig();let pos=e=>{let a=c.getBoundingClientRect();return{x:e.clientX-a.left,y:e.clientY-a.top}};c.onpointerdown=e=>{drawing=true;signed=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!drawing)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>drawing=false}function clearSig(){if(!ctx)return;let r=$('sig').getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#888';ctx.font='17px sans-serif';ctx.textAlign='center';ctx.fillText('여기에 손가락으로 서명하세요',r.width/2,r.height/2);signed=false}async function saveSig(){if(!signed)return toast('서명을 해주세요.');try{let v={signature_path:$('sig').toDataURL('image/png')};await rest('members','id=eq.'+member.id,{method:'PATCH',headers:{Prefer:'return=minimal','Content-Type':'application/json'},body:JSON.stringify(v)});member.signature_path=v.signature_path;home()}catch(e){alert(e.message)}}function label(x){return x==='good'?'오늘 점검 완료':x==='problem'?'점검 이상 있음':x==='not_driving'?'오늘은 미운행':'아직 점검하지 않았습니다'}function result(v){return Object.fromEntries(ITEMS.map((_,i)=>[String(i+1),v]))}async function todayRow(){let a=await rest('inspections','member_id=eq.'+member.id+'&inspection_date=eq.'+today()+'&select=*');return a[0]||null}async function home(){show('home');$('hName').textContent=member.driver_name+' 기사님';$('hCar').textContent=member.vehicle_number;$('date').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());await refreshStatus();await history()}async function refreshStatus(){let r=await todayRow(),x=r?.overall_status||'pending';$('status').className='status '+x;$('status').textContent=label(x)}async function saveRow(x,res,action=null,memo=null){let v={member_id:member.id,inspection_date:today(),overall_status:x,results:res,action_note:action,detail_memo:memo,input_source:'driver',checked_at:new Date().toISOString()};await rest('inspections','on_conflict=member_id,inspection_date',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal','Content-Type':'application/json'},body:JSON.stringify(v)});toast('저장되었습니다.');refreshStatus();history()}function saveSimple(x){if(x==='not_driving'&&!confirm('오늘 운행하지 않은 것이 맞습니까?'))return;saveRow(x,result(x==='good'?'good':'not_driving')).catch(e=>alert(e.message))}function toggleProblem(){$('problemBox').style.display=$('problemBox').style.display==='none'?'block':'none'}async function saveProblem(){let bad=[...document.querySelectorAll('#issues input:checked')].map(x=>x.value),a=$('action').value,m=$('memo').value.trim();if(!bad.length)return toast('문제 항목을 선택하세요.');if(!a)return toast('조치내용을 선택하세요.');let r=result('good');bad.forEach(n=>r[n]='bad');try{await saveRow('problem',r,a,m||null);$('problemBox').style.display='none'}catch(e){alert(e.message)}}async function history(){try{let a=await rest('inspections','member_id=eq.'+member.id+'&select=inspection_date,overall_status&order=inspection_date.desc&limit=14');$('history').innerHTML=a.map(r=>'<div class="hist"><span>'+r.inspection_date+'</span><span>'+label(r.overall_status)+'</span></div>').join('')||'<div class="desc">기록이 없습니다.</div>'}catch{}}async function printMonth(){
  try{
    let d=new Date(),y=d.getFullYear(),mo=d.getMonth()+1,last=new Date(y,mo,0).getDate();
    let start=y+'-'+String(mo).padStart(2,'0')+'-01',end=y+'-'+String(mo).padStart(2,'0')+'-'+String(last).padStart(2,'0');
    let a=await rest('inspections','member_id=eq.'+member.id+'&inspection_date=gte.'+start+'&inspection_date=lte.'+end+'&select=*');
    let by={};a.forEach(r=>by[+r.inspection_date.slice(-2)]=r);
    // 국가법령정보센터 원본은 날짜 머리글에 21일이 빠져 있으나, 실제 일상점검 기록 누락 방지를 위해 1~31일을 모두 표시한다.
    let days=Array.from({length:31},(_,i)=>i+1);
    const groups=[
      {name:'외관점검',rows:[0,1,2,3]},
      {name:'상태점검',rows:[4,5,6]},
      {name:'기타',rows:[7,8,9,10]}
    ];
    const mark=(r,idx)=>{
      if(!r)return '';
      if(r.overall_status==='not_driving')return '미';
      return r.results?.[String(idx+1)]==='bad'?'×':'○';
    };
    let body='';
    groups.forEach(g=>{
      g.rows.forEach((idx,k)=>{
        body+='<tr>';
        if(k===0)body+='<th class="group" rowspan="'+g.rows.length+'">'+g.name.split('').join('<br>')+'</th>';
        body+='<td class="item">'+esc(ITEMS[idx])+'</td>';
        body+=days.map(n=>'<td class="daycell">'+mark(by[n],idx)+'</td>').join('');
        body+='</tr>';
      });
    });
    const sig=member.signature_path||'';
    let sigCells=days.map(n=>{
      let r=by[n];
      if(!r||r.overall_status==='not_driving')return '<td class="sigcell"></td>';
      return sig?'<td class="sigcell"><img src="'+sig+'"></td>':'<td class="sigcell">확인</td>';
    }).join('');
    let actions=[];
    days.forEach(n=>{
      let r=by[n];
      if(r?.overall_status==='problem'){
        let badNums=Object.entries(r.results||{}).filter(([,v])=>v==='bad').map(([k])=>Number(k));
        let badNames=badNums.map(i=>ITEMS[i-1]).filter(Boolean).join(', ');
        let t=n+'일 '+(badNames||'불량상태')+(r.action_note?' - '+r.action_note:'')+(r.detail_memo?' ('+r.detail_memo+')':'');
        actions.push(t);
      }
    });
    let actionText=actions.length?actions.map(x=>esc(x)).join('<br>'):'<span class="example">(예시) 00일 창닦이기 불량 － 00일 창닦이기 교체</span>';
    let w=window.open('','_blank');
    if(!w)return toast('팝업 차단을 해제해 주세요.');
    let html='<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>운수종사자 일상점검표</title><style>'+
      '@page{size:A4 landscape;margin:8mm}*{box-sizing:border-box}body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;margin:0;color:#111;background:#fff;font-size:9pt}'+
      '.sheet{width:100%;margin:0 auto}.law{font-size:8.5pt;margin:0 0 3mm 0}.law .new{color:#1d4ed8}.title{text-align:center;font-size:14pt;font-weight:700;margin:0 0 3mm 0;letter-spacing:.2px}'+
      'table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #333;text-align:center;vertical-align:middle;padding:1.2mm .7mm}'+
      '.info{margin-bottom:2.5mm}.info th{font-weight:400}.info td{font-weight:400}.info .label{width:12%}.info .value{width:21.333%}'+
